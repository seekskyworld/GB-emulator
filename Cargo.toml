[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
debug = 1

# D012：让 SingleStepTests（50 万用例）与整机单测在 `cargo test` 下足够快
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
