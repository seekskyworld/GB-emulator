[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbemu"
version = "0.1.0"
description = "ctypes bindings and pokemon-agent backend for the gb-core emulator"
requires-python = ">=3.10"
dependencies = ["pillow"]

[tool.setuptools.packages.find]
include = ["gbemu*"]
